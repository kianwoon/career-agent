<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 260px; padding: 12px; margin: 0; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .row { display: flex; gap: 6px; margin-bottom: 8px; }
    input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 6px; font: inherit; }
    button { padding: 6px 10px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
    #status { margin-top: 8px; font-weight: 600; }
    .ok { color: #1e9e5f; } .down { color: #c33; }

    /* iOS-style toggle switch */
    .toggle { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
    #enabledToggle {
      position: absolute; opacity: 0; width: 0; height: 0;
      padding: 0; margin: 0; border: 0; flex: none;
    }
    .switch {
      position: relative; flex: none; width: 40px; height: 22px;
      background: #c9ccd1; border-radius: 999px;
      transition: background .2s ease;
    }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; background: #fff; border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,.3);
      transition: transform .2s ease;
    }
    #enabledToggle:checked + .switch { background: #34c759; }
    #enabledToggle:checked + .switch::after { transform: translateX(18px); }
    #enabledToggle:focus-visible + .switch { outline: 2px solid #2f6fed; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Career Agent</h1>
  <div class="row" id="toggleRow">
    <label class="toggle">
      <input id="enabledToggle" type="checkbox" />
      <span class="switch"></span>
      <span>Take jobs (agent ON)</span>
    </label>
  </div>
  <div class="row">
    <input id="api" type="text" placeholder="API base URL" />
  </div>
  <div class="row">
    <button id="save">Save & connect</button>
  </div>
  <div id="status">checking…</div>
  <script src="popup.js"></script>
</body>
</html>
