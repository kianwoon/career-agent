name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend tests + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: career
          POSTGRES_PASSWORD: career
          POSTGRES_DB: career_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U career -d career_agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://career:career@localhost:5432/career_agent
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Create DB tables
        run: uv run python -m app.seed

      - name: Lint (ruff)
        run: uv run ruff check app

      - name: Run tests
        # CDP points nowhere so browser-dependent tests fall back deterministically
        # (no live LinkedIn / Brave session in CI).
        env:
          BRAVE_CDP_URL: http://127.0.0.1:1
          API_KEYS: ""
          LLM_ENABLED: "false"
        run: uv run pytest app/tests -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
